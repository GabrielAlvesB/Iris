# Publica uma versão do Iris quando uma tag v* é enviada (ex.: git push origin v0.1.8).
#
# Por que no GitHub e não no PC: o electron-builder executa um desinstalador
# sem assinatura enquanto monta o instalador NSIS, e o Controle Inteligente de
# Aplicativos do Windows 11 bloqueia isso ("spawn UNKNOWN"). A máquina do
# GitHub não tem essa política. O token vem do próprio Actions: nada a configurar.
name: Release

on:
  push:
    tags: ['v*']
  # Refazer só a parte Linux de uma release que já existe (ex.: o Windows saiu e
  # um teste do Linux falhou por causa do runner). Rodar a partir do main, com a tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da release (ex.: v0.3.2) — só o job linux roda'
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tag e package.json precisam concordar: o app compara a versão da
      # release com app.getVersion(), que vem do package.json.
      - name: Conferir a versão
        shell: pwsh
        run: |
          $versao = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($versao -ne $tag) {
            Write-Error "A tag é v$tag, mas o package.json está em $versao. Rode 'npm version $tag --no-git-tag-version', faça commit e envie a tag de novo."
            exit 1
          }

      - run: npm ci

      - name: Montar e publicar
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linux depois do Windows: os dois publicam na mesma release, e criados ao
  # mesmo tempo disputariam a criação dela.
  linux:
    needs: release
    # Pelo workflow_dispatch o job do Windows é pulado; o Linux roda mesmo assim.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O fpm do electron-builder chama o rpmbuild para o .rpm e o bsdtar para o
      # pacote do pacman (Arch); o runner não traz nenhum dos dois.
      - name: Ferramentas de empacotamento
        run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm libarchive-tools xvfb

      - name: Montar (AppImage, .deb, .rpm e pacman)
        run: npm run dist:linux

      # Teste de fumaça antes de publicar: o app empacotado precisa chegar à
      # primeira tela. IRIS_SAIR_APOS_ABRIR fecha sozinho quando ela aparece; se
      # travar ou cair, o grep não acha o marco e o job para aqui.
      # Sem tela no runner: xvfb. --no-sandbox só aqui: no runner o chrome-sandbox
      # não é SUID (o .deb instalado acerta isso na instalação).
      - name: Conferir que abre
        run: |
          export IRIS_MEDIR_ABERTURA=1 IRIS_SAIR_APOS_ABRIR=1
          timeout 60 xvfb-run -a release/linux-unpacked/iris --no-sandbox --user-data-dir="$RUNNER_TEMP/iris-teste" 2>&1 | tee abertura.log || true
          grep -q "primeira tela" abertura.log

      # Cada pacote instalado na sua distribuição, pelo gerenciador dela (é o
      # que confere as dependências declaradas), abrindo em X11 e em Wayland.
      # O GTK do Arch carrega os ícones por um processo isolado no bwrap, que
      # precisa criar user namespaces e montar /proc. No runner, o AppArmor barra
      # as duas coisas — o sysctl no host e o perfil docker-default no contêiner —
      # e o Iris caía no Wayland ("Failed to load /usr/share/icons/Adwaita…").
      # Num Arch de verdade isso não acontece; liberamos só no runner de teste.
      - name: Conferir os pacotes nas distribuições
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          for alvo in ubuntu:24.04:ubuntu fedora:41:fedora archlinux:latest:arch; do
            imagem="${alvo%:*}"; distro="${alvo##*:}"
            echo "::group::$distro"
            docker run --rm --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
              -v "$PWD/release:/r:ro" -v "$PWD/scripts/linux:/s:ro" "$imagem" bash /s/testar-pacote.sh "$distro"
            echo "::endgroup::"
          done

      # Empacota de novo com publicação (o dist/ já está pronto).
      - name: Publicar
        run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
