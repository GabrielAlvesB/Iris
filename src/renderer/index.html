<body>
  <div id="app-shell">
    <nav id="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-brand-glow"></div>
        <img class="sidebar-logo" src="./assets/icon-64.png" alt="Logo Iris" width="26" height="26" />
        <div class="sidebar-brand-info">
          <span class="sidebar-title">Iris</span>
          <span class="sidebar-subtitle">Workspace</span>

        <button type="button" class="sidebar-toggle-btn" id="sidebar-toggle" title="Recolher menu lateral (Ctrl+B)" aria-label="Alternar menu lateral">

            <path d="m15 18-6-6 6-6"/>

      <div id="sidebar-nav"></div>
      <div class="sidebar-footer">
        <span class="sidebar-footer-dot" title="Modo Local · Dados no seu PC"></span>
        <span class="sidebar-footer-text">Modo Local · Dados no seu PC</span>
      </div>
      <div class="sidebar-resizer" id="sidebar-resizer" title="Arraste para redimensionar (duplo clique para restaurar)"></div>
    </nav>
    <main id="view-root"></main>
  </div>

  <script src="./vendor/sortablejs/Sortable.min.js"></script>
  <script type="module" src="./renderer/app.js"></script>
