<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Ícone do Iris (janela, barra de tarefas, bandeja, instalador, Linux).
    Fonte única: `npm run icones` gera icon.ico, icon.png e o favicon a partir daqui.
    O olho dentro do app é desenhado no código (sidebar.ts) com as cores do destaque.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="0.5" stop-color="#6a35e8"/>
      <stop offset="1" stop-color="#c23aa8"/>
    </linearGradient>
    <radialGradient id="luz" cx="0.28" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iris" x1="0.2" y1="0.05" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#a68bff"/>
      <stop offset="0.5" stop-color="#6c2fe4"/>
      <stop offset="1" stop-color="#d13f9c"/>
    </linearGradient>
    <!-- Aro escuro na borda da íris: é o que dá profundidade sem contorno. -->
    <radialGradient id="aro">
      <stop offset="0.72" stop-color="#160a33" stop-opacity="0"/>
      <stop offset="1" stop-color="#160a33" stop-opacity="0.55"/>
    </radialGradient>
    <clipPath id="disco">
      <circle cx="512" cy="512" r="168"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#fundo)"/>
  <rect x="32" y="32" width="960" height="960" rx="232" fill="url(#luz)"/>

  <path d="M160 512C314 258 710 258 864 512C710 766 314 766 160 512Z" fill="#fff"/>

  <circle cx="512" cy="512" r="168" fill="url(#iris)"/>
  <!-- Lâminas de diafragma: a íris do olho e a da câmera. -->
  <g clip-path="url(#disco)" fill="#fff">
    <path d="M586.0 512.0L586.0 932.0L185.3 786.1L549.0 576.1Z" fill-opacity="0.16"/>
    <path d="M549.0 576.1L185.3 786.1L111.3 366.1L475.0 576.1Z" fill-opacity="0.04"/>
    <path d="M475.0 576.1L111.3 366.1L438.0 92.0L438.0 512.0Z" fill-opacity="0.12"/>
    <path d="M549.0 447.9L912.7 657.9L586.0 932.0L586.0 512.0Z" fill-opacity="0.07"/>
    <path d="M475.0 447.9L838.7 237.9L912.7 657.9L549.0 447.9Z" fill-opacity="0.14"/>
  </g>
  <circle cx="512" cy="512" r="168" fill="url(#aro)"/>
  <circle cx="512" cy="512" r="74" fill="#140a2c"/>
  <circle cx="563" cy="458" r="28" fill="#fff"/>
</svg>
