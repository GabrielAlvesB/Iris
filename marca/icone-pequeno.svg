<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    O mesmo ícone para 16–24 px (bandeja, lista de janelas): olho maior e sem as
    lâminas nem o aro, que nesse tamanho só borram. O gerador escolhe pelo tamanho.
  -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f6bff"/>
      <stop offset="0.5" stop-color="#6a35e8"/>
      <stop offset="1" stop-color="#c23aa8"/>
    </linearGradient>
    <linearGradient id="iris" x1="0.2" y1="0.05" x2="0.8" y2="0.95">
      <stop offset="0" stop-color="#8a63ff"/>
      <stop offset="1" stop-color="#5b1fd6"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#fundo)"/>
  <path d="M56 512C240 196 784 196 968 512C784 828 240 828 56 512Z" fill="#fff"/>
  <circle cx="512" cy="512" r="210" fill="url(#iris)"/>
  <circle cx="512" cy="512" r="96" fill="#140a2c"/>
  <circle cx="582" cy="436" r="40" fill="#fff"/>
</svg>
